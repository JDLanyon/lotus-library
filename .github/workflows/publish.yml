name: Publish to GitHub Packages

# Publishes @jdlanyon/lotus-library to GitHub Packages (npm.pkg.github.com).
# No npm 2FA: auth uses the workflow's built-in GITHUB_TOKEN.
#
# Triggers:
#   - manually from the Actions tab (workflow_dispatch), or
#   - pushing a version tag, e.g. `git tag v0.1.3 && git push origin v0.1.3`.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jdlanyon'

      - run: npm ci
      - run: npm run build:lib

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
