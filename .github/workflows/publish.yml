name: Publish to GitHub Packages

# Publishes @jdlanyon/lotus-library to GitHub Packages (npm.pkg.github.com).
# Auth uses the workflow's built-in GITHUB_TOKEN, so no npm 2FA is involved.
#
# Triggers:
#   - manually from the Actions tab (workflow_dispatch), or
#   - pushing a version tag, e.g. `git tag v0.2.1 && git push origin v0.2.1`.
#
# Deliberately NOT triggered on push to `main`: an earlier scaffold published
# there and shipped the wrong contents as 0.1.x. Publishing is an explicit act,
# and the tag must match package.json.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jdlanyon'

      - run: npm ci

      # Never publish something that does not build or typecheck.
      - name: Typecheck (React + Vue)
        run: npm run typecheck
      - name: Unit tests
        run: npm test

      - name: Build library
        run: npm run build:lib

      # A tag that disagrees with package.json would publish the wrong version.
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing $PKG"

      # `publishConfig` in package.json pins the registry + restricted access.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
