name: CI

# Every push and PR runs the checks. Releases are performed MANUALLY from an
# up-to-date `main` (see RELEASING in README.md); there is no automated release
# job, so no bot commits or tags are ever pushed.
#
# Storybook is deployed by Cloudflare Pages on push to `main`
# (https://lotus-library.jdlanyon.dev/), NOT from this workflow. The old
# GitHub Pages job was removed so there is a single source of truth.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Build before typechecking: src/react/next.tsx imports the package's own
      # entry, which only resolves once dist/react/index.d.ts exists (see
      # publish.yml). Typechecking first fails with TS2307 on a clean checkout.
      - name: Build library
        run: npm run build:lib
      - name: Typecheck (React + Vue)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

