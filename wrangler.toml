# Cloudflare Pages configuration for the Storybook showcase.
#
# Serves the static Storybook at the DOMAIN ROOT of
# https://lotus-library.jdlanyon.dev/ — no subpath, so no STORYBOOK_BASE_PATH.
#
# This file pins the build so a dashboard misconfiguration can't silently
# change what ships. It is a static site: no Functions, no SSR.

[build]
command = "npm run build-storybook"
publish = "storybook-static"
[build.environment]
NODE_ENV = "production"
# Match .nvmrc / CI; the chromatic addon's transitive deps require >=22.
NODE_VERSION = "22"

# Storybook emits content-hashed assets, safe to cache aggressively.
[[headers]]
for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The shell and story index must always be revalidated.
[[headers]]
for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

